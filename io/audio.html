<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>io — Teste de áudio</title>
<style>
:root{--bg:#090b12;--panel:#111521;--line:#272c3b;--text:#f7f8fb;--muted:#9ca4b8;--a:#7c6cff;--b:#35d7ff;--ok:#52db8d;--bad:#ff7d8a}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 85% 0%,rgba(124,108,255,.18),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900}.brand h1{margin:0}.muted{color:var(--muted);line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.btn{border:1px solid var(--line);background:#181d2a;color:#fff;border-radius:15px;padding:14px;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--a),#5b8cff)}.box{min-height:100px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#0c0f17;white-space:pre-wrap}.status{margin-top:10px;font-size:13px;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">io</div><div><h1>Teste de áudio</h1><div class="muted">microfone + voz da io</div></div></div>
  <p class="muted">Esta página testa o áudio do celular sem salvar a gravação no Supabase. O reconhecimento de fala pode usar o serviço de voz do próprio navegador/sistema, dependendo do aparelho.</p>
  <div class="row">
    <button id="mic" class="btn primary">🎙️ Testar microfone</button>
    <button id="speaker" class="btn">🔊 Ouvir a io</button>
  </div>
  <div id="box" class="box">Toque em “Testar microfone” e diga: “io, teste de voz”.</div>
  <div id="status" class="status">Aguardando teste.</div>
</main>
<script>
const mic=document.querySelector('#mic'),speaker=document.querySelector('#speaker'),box=document.querySelector('#box'),status=document.querySelector('#status');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){
  rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{status.className='status';status.textContent='Ouvindo...';mic.textContent='🎙️ Ouvindo...'};
  rec.onend=()=>{mic.textContent='🎙️ Testar microfone'};
  rec.onerror=e=>{status.className='status bad';status.textContent='Erro do microfone/voz: '+(e.error||'desconhecido')};
  rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';box.textContent=t;status.className='status ok';status.textContent='Microfone reconhecido com sucesso.'};
}else{
  mic.disabled=true;status.className='status bad';status.textContent='Este navegador não oferece SpeechRecognition. Tente o Chrome atualizado no Android.';
}
mic.onclick=()=>{if(!rec)return;try{rec.start()}catch{}};
speaker.onclick=()=>{
  if(!('speechSynthesis' in window)){status.className='status bad';status.textContent='Este navegador não oferece voz sintetizada.';return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('Olá Lucas. O áudio da io está funcionando.');
  u.lang='pt-BR';u.rate=1;u.onend=()=>{status.className='status ok';status.textContent='Saída de voz funcionando.'};
  speechSynthesis.speak(u);
};
</script>
</body>
</html>
