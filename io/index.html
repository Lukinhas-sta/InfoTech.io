<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <meta name="color-scheme" content="dark">
  <title>io — Assistente pessoal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#090b12;--panel:#10131d;--panel2:#151925;--line:#272c3b;--text:#f7f8fb;--muted:#9ca4b8;--a:#7c6cff;--b:#35d7ff;--danger:#ff7d8a;--ok:#52db8d;--shadow:0 24px 70px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% 0%,rgba(124,108,255,.16),transparent 32%),radial-gradient(circle at 0 80%,rgba(53,215,255,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}button{cursor:pointer}.shell{min-height:100dvh;display:grid;grid-template-columns:285px 1fr}.sidebar{border-right:1px solid var(--line);background:rgba(12,15,23,.85);backdrop-filter:blur(18px);padding:18px 14px;display:flex;flex-direction:column;gap:16px;min-width:0}.brand{display:flex;align-items:center;gap:11px;padding:4px 6px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 10px 30px rgba(89,116,255,.26)}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}.primary,.secondary,.danger,.iconbtn{border-radius:13px;font-weight:700}.primary{border:0;padding:11px 14px;background:linear-gradient(135deg,var(--a),#5b8cff);color:white}.secondary{padding:10px 13px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{padding:8px 10px;background:rgba(255,107,122,.1);color:#ff9aa5;border:1px solid rgba(255,107,122,.18)}.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--panel2);color:#fff}.side-actions{display:grid;grid-template-columns:1fr 44px;gap:8px}.convos{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:100px}.convo{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:11px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.convo.active,.convo:hover{background:rgba(124,108,255,.12);border-color:rgba(124,108,255,.2);color:#fff}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.user{display:flex;align-items:center;gap:9px;min-width:0}.avatar{width:35px;height:35px;border-radius:50%;background:#202536;display:grid;place-items:center;font-weight:800}.usertext{min-width:0;flex:1}.usertext b,.usertext span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.usertext span{font-size:12px;color:var(--muted)}.main{height:100dvh;min-width:0;display:flex;flex-direction:column}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(9,11,18,.65);backdrop-filter:blur(14px)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px rgba(82,219,141,.55)}.chatwrap{flex:1;overflow:auto;padding:26px 16px 160px}.chat{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:16px}.welcome{text-align:center;max-width:620px;margin:10vh auto 0}.biglogo{width:82px;height:82px;border-radius:27px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;margin:0 auto 20px;font-size:28px;font-weight:900;box-shadow:0 20px 60px rgba(90,118,255,.25)}.welcome h2{font-size:34px;margin:0 0 9px}.welcome p{color:var(--muted);line-height:1.6;margin:0}.msg{display:flex;gap:11px;align-items:flex-start}.msg.user{justify-content:flex-end}.mini{width:32px;height:32px;border-radius:11px;background:#1b2030;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.assistant .mini{background:linear-gradient(135deg,var(--a),#568cff)}.user .mini{order:2}.bubble{max-width:min(720px,86%);padding:13px 15px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58}.user .bubble{background:rgba(124,108,255,.15);border-color:rgba(124,108,255,.24)}.composerwrap{position:fixed;left:285px;right:0;bottom:0;padding:22px 16px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}.composer{max-width:850px;margin:auto;border:1px solid var(--line);background:#111521;border-radius:22px;padding:9px 9px 9px 16px;display:flex;align-items:flex-end;gap:9px;box-shadow:var(--shadow)}.composer textarea{flex:1;border:0;outline:0;resize:none;min-height:28px;max-height:150px;background:transparent;color:#fff;padding:8px 0;line-height:1.5}.composer textarea::placeholder{color:#737c92}.send{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--a),#578bff);color:#fff;font-size:20px;font-weight:900}.send:disabled{opacity:.45}.notice{max-width:850px;margin:10px auto 0;padding:11px 13px;border:1px solid rgba(255,193,7,.2);background:rgba(255,193,7,.07);border-radius:12px;color:#e7d28d;font-size:13px;line-height:1.45}.overlay{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px;z-index:50}.card{width:min(440px,100%);background:#111521;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}.card h2{margin:0 0 7px}.card p{color:var(--muted);line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;color:#b7bfd1}.field input,.field select,.field textarea{width:100%;background:#0c0f17;border:1px solid var(--line);color:#fff;border-radius:13px;padding:12px 13px;outline:0}.error{min-height:20px;color:#ff9aa5;font-size:13px;margin:7px 0}.full{width:100%}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:#10131d;border-left:1px solid var(--line);z-index:60;padding:20px;box-shadow:var(--shadow);overflow:auto}.drawerhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.memory{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0d1018;margin:9px 0}.memory small{color:var(--muted)}.memory p{margin:6px 0;line-height:1.45}.memactions{display:flex;justify-content:flex-end}.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;background:#9ea8bf;border-radius:50%;animation:p 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}.mobile{display:none}.backdrop{display:none}
    @media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:40;transform:translateX(-103%);transition:.22s}.sidebar.open{transform:none}.backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}.composerwrap{left:0}.top{padding:0 13px}.mobile{display:inline-grid;place-items:center}.welcome{margin-top:6vh}.welcome h2{font-size:29px}.chatwrap{padding-left:11px;padding-right:11px}.bubble{max-width:88%}}
  </style>
</head>
<body>
<div id="login" class="overlay"><form id="loginForm" class="card"><div class="brand" style="padding:0 0 14px"><div class="logo">io</div><div><h1>io</h1><small>Sua assistente pessoal</small></div></div><h2>Entrar</h2><p>Use sua conta autorizada para acessar a io.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button id="loginBtn" class="primary full" type="submit">Entrar na io</button></form></div>
<div id="app" class="shell hidden"><aside id="sidebar" class="sidebar"><div class="brand"><div class="logo">io</div><div><h1>io</h1><small>Assistente pessoal</small></div></div><div class="side-actions"><button id="newBtn" class="primary">+ Nova conversa</button><button id="memoryBtn" class="secondary" title="Memória">◆</button></div><div id="convos" class="convos"></div><div class="side-footer"><div class="user"><div class="avatar">L</div><div class="usertext"><b id="userName">Lucas</b><span id="userEmail"></span></div><button id="logout" class="iconbtn">↪</button></div></div></aside><div id="backdrop" class="backdrop"></div><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button id="menu" class="iconbtn mobile">☰</button><strong id="title">Nova conversa</strong></div><div class="status"><span class="dot"></span><span>io online</span></div></header><div id="notice" class="notice hidden"></div><div id="chatwrap" class="chatwrap"><div id="chat" class="chat"></div></div><div class="composerwrap"><form id="composer" class="composer"><textarea id="input" rows="1" maxlength="8000" placeholder="Fale com a io..."></textarea><button id="send" class="send" type="submit">↑</button></form></div></main></div>
<aside id="drawer" class="drawer hidden"><div class="drawerhead"><div><h2 style="margin:0">Memória da io</h2><small style="color:var(--muted)">Informações usadas quando forem relevantes</small></div><button id="closeMemory" class="iconbtn">×</button></div><form id="memForm" style="margin-top:18px"><div class="field"><label>Tipo</label><select id="kind"><option value="preference">Preferência</option><option value="project">Projeto</option><option value="routine">Rotina</option><option value="instruction">Instrução</option><option value="fact">Informação</option><option value="other">Outro</option></select></div><div class="field"><label>O que a io deve lembrar?</label><textarea id="memContent" rows="3" maxlength="4000"></textarea></div><div class="field"><label>Importância</label><select id="importance"><option value="3">Normal</option><option value="4">Importante</option><option value="5">Muito importante</option><option value="2">Baixa</option><option value="1">Muito baixa</option></select></div><button class="primary full" type="submit">Salvar memória</button></form><div style="margin-top:22px"><strong>Memórias salvas</strong><div id="memList" style="margin-top:9px"></div></div></aside>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.55.0/+esm';
const URL='https://rgngqumqzylthdiazvfu.supabase.co';
const KEY='sb_publishable_Nw2oaGdMQHVIJNhUpjv5ag_JcxmRu2w';
const supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s), e={login:$('#login'),loginForm:$('#loginForm'),email:$('#email'),password:$('#password'),loginError:$('#loginError'),loginBtn:$('#loginBtn'),app:$('#app'),userName:$('#userName'),userEmail:$('#userEmail'),logout:$('#logout'),newBtn:$('#newBtn'),memoryBtn:$('#memoryBtn'),convos:$('#convos'),chat:$('#chat'),chatwrap:$('#chatwrap'),title:$('#title'),composer:$('#composer'),input:$('#input'),send:$('#send'),notice:$('#notice'),drawer:$('#drawer'),closeMemory:$('#closeMemory'),memForm:$('#memForm'),kind:$('#kind'),memContent:$('#memContent'),importance:$('#importance'),memList:$('#memList'),sidebar:$('#sidebar'),menu:$('#menu'),backdrop:$('#backdrop')};
let user=null,active=null,conversations=[],sending=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function welcome(){e.chat.innerHTML='<section class="welcome"><div class="biglogo">io</div><h2>Oi, eu sou a io.</h2><p>Sua assistente pessoal. Conversas e memórias ficam ligadas à sua conta.</p></section>';e.title.textContent='Nova conversa'}
function notice(t){e.notice.textContent=t;e.notice.classList.toggle('hidden',!t)}
function showLogin(v){e.login.classList.toggle('hidden',!v);e.app.classList.toggle('hidden',v)}
function closeMobile(){e.sidebar.classList.remove('open');e.backdrop.classList.remove('show')}
function msg(role,text,temp=false){const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="mini">'+(role==='assistant'?'io':'L')+'</div><div class="bubble">'+(temp?'<span class="typing"><i></i><i></i><i></i></span>':esc(text))+'</div>';return d}
function bottom(){requestAnimationFrame(()=>e.chatwrap.scrollTop=e.chatwrap.scrollHeight)}
async function access(){const {data,error}=await supabase.from('alex_access').select('enabled').eq('user_id',user.id).eq('enabled',true).maybeSingle();return !error&&!!data}
async function ensureSettings(){const {data}=await supabase.from('alex_user_settings').select('user_id').eq('user_id',user.id).maybeSingle();if(!data)await supabase.from('alex_user_settings').insert({user_id:user.id,assistant_name:'io',preferred_language:'pt-BR'})}
async function boot(session){user=session?.user||null;if(!user){showLogin(true);return}if(!await access()){await supabase.auth.signOut();showLogin(true);e.loginError.textContent='Esta conta não está autorizada a usar a io.';return}showLogin(false);e.userEmail.textContent=user.email||'';e.userName.textContent=(user.user_metadata?.full_name||'Lucas').split(' ')[0];await ensureSettings();await loadConvos();welcome();notice('')}
async function loadConvos(){const {data,error}=await supabase.from('alex_conversations').select('id,title,updated_at').order('updated_at',{ascending:false}).limit(60);if(error)return;conversations=data||[];e.convos.innerHTML=conversations.length?'':'<div style="color:var(--muted);font-size:13px;padding:8px">Nenhuma conversa ainda.</div>';for(const c of conversations){const b=document.createElement('button');b.className='convo'+(c.id===active?' active':'');b.textContent=c.title;b.onclick=()=>openConvo(c.id,c.title);e.convos.appendChild(b)}}
async function openConvo(id,t){active=id;e.title.textContent=t||'Conversa';closeMobile();const {data}=await supabase.from('alex_messages').select('role,content,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);e.chat.innerHTML='';for(const m of data||[])if(m.role==='user'||m.role==='assistant')e.chat.appendChild(msg(m.role,m.content));await loadConvos();bottom()}
function newChat(){active=null;welcome();loadConvos();e.input.focus();closeMobile()}
async function sendMessage(text){if(sending||!text.trim())return;sending=true;e.send.disabled=true;const clean=text.trim();if(e.chat.querySelector('.welcome'))e.chat.innerHTML='';e.chat.appendChild(msg('user',clean));const typing=msg('assistant','',true);e.chat.appendChild(typing);e.input.value='';resize();bottom();try{const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Sessão expirada. Entre novamente.');const r=await fetch(URL+'/functions/v1/alex-chat',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({message:clean,conversation_id:active})});const p=await r.json().catch(()=>({}));typing.remove();if(!r.ok){e.chat.appendChild(msg('assistant',p.error||'Não consegui responder agora.'));notice(p.error||'Erro ao chamar a io.')}else{active=p.conversation_id;e.chat.appendChild(msg('assistant',p.reply));notice('');await loadConvos();const c=conversations.find(x=>x.id===active);if(c)e.title.textContent=c.title}bottom()}catch(err){typing.remove();e.chat.appendChild(msg('assistant',err.message||'Erro de conexão.'));notice(err.message||'Erro de conexão.')}finally{sending=false;e.send.disabled=false;e.input.focus()}}
function resize(){e.input.style.height='auto';e.input.style.height=Math.min(150,e.input.scrollHeight)+'px'}
async function loadMem(){const {data}=await supabase.from('alex_memories').select('id,kind,content,importance,updated_at').order('importance',{ascending:false}).order('updated_at',{ascending:false}).limit(100);e.memList.innerHTML=(data||[]).length?'':'<div style="color:var(--muted);font-size:13px">Nenhuma memória cadastrada.</div>';for(const m of data||[]){const d=document.createElement('div');d.className='memory';d.innerHTML='<small>'+esc(m.kind)+' · importância '+m.importance+'</small><p>'+esc(m.content)+'</p><div class="memactions"><button class="danger">Excluir</button></div>';d.querySelector('button').onclick=async()=>{await supabase.from('alex_memories').delete().eq('id',m.id);loadMem()};e.memList.appendChild(d)}}
e.loginForm.addEventListener('submit',async ev=>{ev.preventDefault();e.loginError.textContent='';e.loginBtn.disabled=true;const {data,error}=await supabase.auth.signInWithPassword({email:e.email.value.trim(),password:e.password.value});e.loginBtn.disabled=false;if(error){e.loginError.textContent='Não foi possível entrar. Confira e-mail e senha.';return}await boot(data.session)});
e.logout.onclick=async()=>{await supabase.auth.signOut();user=null;active=null;showLogin(true)};e.newBtn.onclick=newChat;e.composer.addEventListener('submit',ev=>{ev.preventDefault();sendMessage(e.input.value)});e.input.addEventListener('input',resize);e.input.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();e.composer.requestSubmit()}});e.memoryBtn.onclick=()=>{e.drawer.classList.remove('hidden');loadMem();closeMobile()};e.closeMemory.onclick=()=>e.drawer.classList.add('hidden');e.memForm.addEventListener('submit',async ev=>{ev.preventDefault();const content=e.memContent.value.trim();if(!content)return;const {error}=await supabase.from('alex_memories').insert({user_id:user.id,kind:e.kind.value,content,importance:Number(e.importance.value),source:'user'});if(!error){e.memContent.value='';loadMem()}});e.menu.onclick=()=>{e.sidebar.classList.add('open');e.backdrop.classList.add('show')};e.backdrop.onclick=closeMobile;
const {data:{session}}=await supabase.auth.getSession();await boot(session);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
