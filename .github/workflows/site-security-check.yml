name: Site security check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject private files and obvious server secrets
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|p12|pfx|key)$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Arquivos privados rastreados pelo Git:"
            echo "$bad_files"
            exit 1
          fi

          obsolete_ops="$(git ls-files | grep -E '^ALTERACOES-.*(ADMIN|SUPABASE).*|^CONFIGURAR-.*SUPABASE.*|^SUPABASE-SECURITY-.*\.sql$|^SUPABASE-HARDENING-.*\.sql$' || true)"
          if [ -n "$obsolete_ops" ]; then
            echo "Arquivos operacionais antigos não devem voltar à árvore pública:"
            echo "$obsolete_ops"
            exit 1
          fi

          if grep -RInE \
            --include='*.js' --include='*.html' --include='*.json' \
            --exclude-dir='.git' \
            'service[_-]?role|sb_secret_[A-Za-z0-9_-]{8,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then
            echo "Possível segredo administrativo encontrado em arquivo público."
            exit 1
          fi

      - name: Reject oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          oversized="$(git ls-files -z | xargs -0 -r du -b | awk '$1 > 10485760 {print $1 " bytes\t" $2}')"
          if [ -n "$oversized" ]; then
            echo "Arquivo rastreado acima de 10 MiB; mova mídia grande para armazenamento/CDN apropriado:"
            echo "$oversized"
            exit 1
          fi

      - name: Verify required public security files
        shell: bash
        run: |
          set -euo pipefail
          test -f robots.txt
          test -f sitemap.xml
          test -f SECURITY.md
          test -f .well-known/security.txt
          test -f .nojekyll
          test -f _headers

          expires="$(awk -F': ' '/^Expires:/ {print $2}' .well-known/security.txt)"
          test -n "$expires"
          test "$(date -u -d "$expires" +%s)" -gt "$(date -u +%s)"

      - name: Verify future edge security baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  Content-Security-Policy:' _headers
          grep -q "default-src 'self'" _headers
          grep -q "object-src 'none'" _headers
          grep -q "frame-ancestors 'none'" _headers
          grep -q 'upgrade-insecure-requests' _headers
          grep -q '^  Strict-Transport-Security: max-age=31536000; includeSubDomains$' _headers
          grep -q '^  X-Content-Type-Options: nosniff$' _headers
          grep -q '^  X-Frame-Options: DENY$' _headers
          grep -q '^  Permissions-Policy:' _headers

      - name: Verify HTML security baseline
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r page; do
            grep -q 'Content-Security-Policy' "$page" || { echo "$page sem CSP"; exit 1; }
            if grep -q "'unsafe-inline'" "$page"; then
              echo "$page permite unsafe-inline"
              exit 1
            fi
          done < <(find . -maxdepth 1 -name '*.html' -type f -print)

          for page in admin-login.html admin-seguranca.html admin-solicitacao.html painel-admin.html cliente-admin.html clientes-admin.html; do
            [ -f "$page" ] || continue
            grep -qi 'noindex' "$page" || { echo "$page sem noindex"; exit 1; }
          done

          if grep -RInE --include='*.html' '@supabase/supabase-js@(2|latest)([^0-9.]|$)' .; then
            echo "Supabase JS usa versão flutuante; fixe uma versão exata."
            exit 1
          fi

      - name: Verify local site references and metadata
        run: python3 scripts/site_sanity.py

      - name: Verify HTTPS-only production references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.html' --include='*.js' --include='*.css' \
            --exclude-dir='.git' \
            '(^|["'"'"'(=[:space:]])http://infotech-io\.com\.br|http://rgngqumqzylthdiazvfu\.supabase\.co' .; then
            echo "Referência HTTP insegura encontrada."
            exit 1
          fi
